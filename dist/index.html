<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenCode Preview</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #07111f;
        --panel: rgba(15, 23, 42, 0.8);
        --line: rgba(148, 163, 184, 0.25);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #8b5cf6;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, #0f172a 0%, var(--bg) 38%, #020617 100%);
        color: var(--text);
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 2rem;
      }
      .card {
        width: min(720px, 100%);
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 18px;
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.45);
        padding: clamp(1.5rem, 4vw, 3rem);
      }
      .eyebrow {
        margin: 0 0 0.8rem;
        color: #c4b5fd;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 700;
        font-size: 0.72rem;
      }
      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2.2rem, 5vw, 4rem);
        line-height: 1.08;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.6;
      }
      .pill {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.7rem 1rem;
        border-radius: 999px;
        background: rgba(139, 92, 246, 0.15);
        border: 1px solid rgba(167, 139, 250, 0.5);
        color: #ddd6fe;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="eyebrow">OpenCode Preview</div>
      <h1>Project is running.</h1>
      <p>
        This static preview server is serving the built output from the project directory.
        It was generated by the project start script to satisfy the required deployment metadata.
      </p>
      <div class="pill">PORT: 3000</div>
    </main>
  </body>
</html>
